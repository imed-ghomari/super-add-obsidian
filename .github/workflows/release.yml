name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-attest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Verify manifest version matches release tag
        run: |
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Manifest version: ${MANIFEST_VERSION}"
          echo "Tag version: ${TAG_VERSION}"
          test "${MANIFEST_VERSION}" = "${TAG_VERSION}"

      - name: Prepare user-oriented release notes
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE="RELEASE_NOTES_${TAG_VERSION}.md"
          BODY_FILE="release-body.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "Using $NOTES_FILE as release notes."
            cp "$NOTES_FILE" "$BODY_FILE"
          else
            echo "No $NOTES_FILE found, using fallback notes."
            {
              echo "## SuperAdd ${TAG_VERSION}";
              echo "";
              echo "See the changelog below for details.";
            } > "$BODY_FILE"
          fi

      - name: Create GitHub release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release-body.md
          files: |
            main.js
            manifest.json
            styles.css
          generate_release_notes: true

      - name: Attest main.js provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: main.js

      - name: Attest styles.css provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: styles.css
